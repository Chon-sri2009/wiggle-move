name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # submit_session validation is pure TypeScript; Node 24 runs .ts
      # directly (type stripping needs Node >= 22.18 / 23.6).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Edge Function tests
        run: node --test "supabase/functions/submit_session/*.test.ts"

  # Runs every migration, the seed and the pgTAP tests on a real Postgres.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,inbucket

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Database tests
        run: supabase test db
