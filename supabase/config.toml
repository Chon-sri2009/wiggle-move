# Local Supabase stack settings. Created by hand; `supabase init` would
# generate a longer file with the same defaults, so replace this with that
# output if the CLI complains about a missing key.
project_id = "wiggle-move"

[api]
enabled = true

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# Password-reset emails open the app through this scheme (AndroidManifest.xml,
# Info.plist). Add the same URL under Authentication > URL Configuration on
# the hosted project.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["wigglemove://reset-callback"]
minimum_password_length = 8

[functions.submit_session]
enabled = true
verify_jwt = true

[functions.delete_account]
enabled = true
verify_jwt = true
